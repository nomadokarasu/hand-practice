<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HandPractice Toolkit</title>
</head>

<body>

<h1>HandPractice Toolkit</h1>

<p>
HandPractice用の教材を作成するツールです。
</p>

<label for="files">
    元画像フォルダを選択
</label>

<input
    type="file"
    id="files"
    webkitdirectory
    multiple
    accept=".jpg,.jpeg,.png,.gif,.webp,image/jpeg,image/png,image/gif,image/webp"
>

<p id="fileCount">
    元画像フォルダはまだ選択されていません。
</p>

<label for="prefix">
    ファイル名
</label>

<input
    type="text"
    id="prefix"
    value="hand"
>

<p>
    出力例：
    <strong id="fileNameExample">
        hand001.webp
    </strong>
</p>

<script>

const filesInput =
    document.getElementById("files");

const fileCount =
    document.getElementById("fileCount");

const prefixInput =
    document.getElementById("prefix");

const fileNameExample =
    document.getElementById("fileNameExample");

let selectedImages = [];

filesInput.addEventListener(
    "change",
    () => {

        const files =
            Array.from(filesInput.files);

        selectedImages =
            files
                .filter((file) => {

                    return file.type.startsWith("image/");

                })
                .sort((fileA, fileB) => {

                    return fileA.name.localeCompare(
                        fileB.name,
                        "ja",
                        {
                            numeric: true,
                            sensitivity: "base"
                        }
                    );

                });

        const count =
            selectedImages.length;

        if (count === 0) {

            fileCount.textContent =
                "選択したフォルダに画像がありません。";

            return;

        }

        fileCount.textContent =
            `${count}枚の画像を読み込みました。`;

    }
);

prefixInput.addEventListener(
    "input",
    () => {

        const prefix =
            prefixInput.value.trim();

        if (!prefix) {

            fileNameExample.textContent =
                "001.webp";

            return;

        }

        fileNameExample.textContent =
            `${prefix}001.webp`;

    }
);

</script>

</body>
</html>
