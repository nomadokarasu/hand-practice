<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HandPractice Toolkit</title>
</head>

<body>

<h1>HandPractice Toolkit</h1>

<p>
HandPractice用の教材を作成するツールです。
</p>

<label for="files">
    元画像フォルダを選択
</label>

<input
    type="file"
    id="files"
    webkitdirectory
    multiple
    accept=".jpg,.jpeg,.png,.gif,.webp,image/jpeg,image/png,image/gif,image/webp"
>

<p id="fileCount">
    元画像フォルダはまだ選択されていません。
</p>

<label for="prefix">
    ファイル名
</label>

<input
    type="text"
    id="prefix"
    value="hand"
>

<p>
    出力例：
    <strong id="fileNameExample">
        hand001.webp
    </strong>
</p>

<script>

const filesInput =
    document.getElementById("files");

const fileCount =
    document.getElementById("fileCount");

const prefixInput =
    document.getElementById("prefix");

const fileNameExample =
    document.getElementById("fileNameExample");

filesInput.addEventListener(
    "change",
    () => {

        const count =
            filesInput.files.length;

        if (count === 0) {

    fileCount.textContent =
        "元画像フォルダはまだ選択されていません。";

    return;

}

fileCount.textContent =
    `${count}個のファイルが入ったフォルダを選択しました。`;

    }
);

prefixInput.addEventListener(
    "input",
    () => {

        const prefix =
            prefixInput.value.trim();

        if (!prefix) {

            fileNameExample.textContent =
                "001.webp";

            return;

        }

        fileNameExample.textContent =
            `${prefix}001.webp`;

    }
);

</script>

</body>
</html>
