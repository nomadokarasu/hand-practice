<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HandPractice Toolkit</title>

<script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>

</head>

<body>

<h1>HandPractice Toolkit</h1>

<p>
HandPractice用の教材を作成するツールです。
</p>

<label for="files">
    元画像フォルダを選択
</label>

<input
    type="file"
    id="files"
    webkitdirectory
    multiple
    accept=".jpg,.jpeg,.png,.gif,.webp,image/jpeg,image/png,image/gif,image/webp"
>

<p id="fileCount">
    元画像フォルダはまだ選択されていません。
</p>

<label for="prefix">
    ファイル名
</label>

<input
    type="text"
    id="prefix"
    value="hand"
>

<p>
    出力例：
    <strong id="fileNameExample">
        hand001.webp
    </strong>
</p>

<h2>
    出力設定
</h2>

<p>
    長辺：1400px
</p>

<p>
    最大容量：400KB
</p>

<p>
    形式：WebP
</p>

<h2>
    出力予定
</h2>

<p id="outputPreviewMessage">
    元画像フォルダを選択すると、出力範囲が表示されます。
</p>

<button
    type="button"
    id="convertButton"
>
    変換開始
</button>

<p id="progressMessage"></p>

<script>

const filesInput =
    document.getElementById("files");

const fileCount =
    document.getElementById("fileCount");

const prefixInput =
    document.getElementById("prefix");

const fileNameExample =
    document.getElementById("fileNameExample");

const outputPreviewMessage =
    document.getElementById("outputPreviewMessage");

const convertButton =
    document.getElementById("convertButton");

const progressMessage =
    document.getElementById("progressMessage");

let selectedImages = [];
let convertedImages = [];

function updateOutputPreview() {

    if (selectedImages.length === 0) {

        outputPreviewMessage.textContent =
            "元画像フォルダを選択すると、出力範囲が表示されます。";

        return;

    }

    const prefix =
        prefixInput.value.trim() || "hand";

    const firstNumber =
        String(1).padStart(3, "0");

    const lastNumber =
        String(selectedImages.length).padStart(3, "0");

    const firstFileName =
        `${prefix}${firstNumber}.webp`;

    const lastFileName =
        `${prefix}${lastNumber}.webp`;

    if (selectedImages.length === 1) {

        outputPreviewMessage.textContent =
            firstFileName;

        return;

    }

    outputPreviewMessage.textContent =
        `${firstFileName} ～ ${lastFileName}`;

}

filesInput.addEventListener(
    "change",
    () => {

        const files =
            Array.from(filesInput.files);

        selectedImages =
            files
                .filter((file) => {

                    return file.type.startsWith("image/");

                })
                .sort((fileA, fileB) => {

                    return fileA.name.localeCompare(
                        fileB.name,
                        "ja",
                        {
                            numeric: true,
                            sensitivity: "base"
                        }
                    );

                });

        const count =
            selectedImages.length;

        if (count === 0) {

    fileCount.textContent =
        "選択したフォルダに画像がありません。";

    updateOutputPreview();

    return;

}

fileCount.textContent =
    `${count}枚の画像を読み込みました。`;

updateOutputPreview();

}
);

prefixInput.addEventListener(
    "input",
    () => {

        const prefix =
            prefixInput.value.trim();

        if (!prefix) {

            fileNameExample.textContent =
                "001.webp";

            updateOutputPreview();

            return;

        }

        fileNameExample.textContent =
            `${prefix}001.webp`;

        updateOutputPreview();

    }
);

function canvasToWebP(canvas, quality) {

    return new Promise(
        (resolve, reject) => {

            canvas.toBlob(
                (blob) => {

                    if (!blob) {

                        reject(
                            new Error("WebP変換に失敗しました。")
                        );

                        return;

                    }

                    resolve(blob);

                },
                "image/webp",
                quality
            );

        }
    );

}

async function convertImage(file) {

    const objectUrl =
        URL.createObjectURL(file);

    try {

        const image =
            new Image();

        image.src =
            objectUrl;

        await image.decode();

        const maxLongSide = 1400;

        const originalLongSide =
            Math.max(image.width, image.height);

        const scale =
            Math.min(1, maxLongSide / originalLongSide);

        const width =
            Math.round(image.width * scale);

        const height =
            Math.round(image.height * scale);

        const canvas =
            document.createElement("canvas");

        canvas.width = width;
        canvas.height = height;

        const context =
            canvas.getContext("2d");

        if (!context) {

            throw new Error(
                "画像処理を開始できませんでした。"
            );

        }

        context.drawImage(
            image,
            0,
            0,
            width,
            height
        );

        const maxBytes =
            400 * 1024;

        let minimumQuality = 0.1;
        let maximumQuality = 0.95;
        let resultBlob =
            await canvasToWebP(
                canvas,
                maximumQuality
            );

        for (
            let attempt = 0;
            attempt < 8;
            attempt += 1
        ) {

            const quality =
                (minimumQuality + maximumQuality) / 2;

            const blob =
                await canvasToWebP(
                    canvas,
                    quality
                );

            if (blob.size <= maxBytes) {

                resultBlob = blob;
                minimumQuality = quality;

            } else {

                maximumQuality = quality;

            }

        }

        if (resultBlob.size > maxBytes) {

            resultBlob =
                await canvasToWebP(
                    canvas,
                    0.1
                );

        }

        return resultBlob;

    } finally {

        URL.revokeObjectURL(objectUrl);

    }

}

convertButton.addEventListener(
    "click",
    async () => {

        if (selectedImages.length === 0) {

            progressMessage.textContent =
                "先に元画像フォルダを選択してください。";

            return;

        }

        convertButton.disabled = true;
        convertedImages = [];

        try {

            const prefix =
                prefixInput.value.trim() || "hand";

            for (
                let index = 0;
                index < selectedImages.length;
                index += 1
            ) {

                progressMessage.textContent =
                    `変換中... ${index + 1} / ${selectedImages.length}枚`;

                const blob =
                    await convertImage(
                        selectedImages[index]
                    );

                const number =
                    String(index + 1).padStart(3, "0");

                convertedImages.push({
                    name: `${prefix}${number}.webp`,
                    blob
                });

            }

            progressMessage.textContent =
                `${convertedImages.length}枚の変換が完了しました。`;

        } catch (error) {

            console.error(error);

            progressMessage.textContent =
                "変換中にエラーが発生しました。";

        } finally {

            convertButton.disabled = false;

        }

    }
);

</script>

</body>
</html>
